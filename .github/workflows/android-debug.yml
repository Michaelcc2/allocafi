name: Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "app.js"
      - "mobile-runtime.js"
      - "index.html"
      - "styles.css"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/copy-web-assets.mjs"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - "app.js"
      - "mobile-runtime.js"
      - "index.html"
      - "styles.css"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/copy-web-assets.mjs"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web and account tests
        run: pnpm test
      - name: Sync native project
        run: pnpm run android:sync
      - name: Run Android readiness gate
        run: pnpm run test:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: allocafi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
